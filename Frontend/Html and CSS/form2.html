<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>
<style>
    body{
        background-color: lightblue;
    }
    h1{
        text-align: center;
    }
    form{
        width: 400px;
        margin: 0 auto;
        padding: 20px;
        background-color: #f2f2f2;
        border-radius: 10px;
    }
    label{
        display: inline-block;

        text-align: right;
        font-weight: bold;
        
    }
    input{
        padding: 8px;
        border-radius: 5px;
        border: 1px solid #000;
    }
    button{
        padding: 10px 20px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        align-items: center;
    }
</style>
<body>
    <form method="POST" action="/submit">
        <h1 style="color: black;">Registration Form</h1>
        <label>Name:</label>
        <input type="text" placeholder="Enter full name">
        <br><br>
        <label>Email:</label>
        <input type="email" placeholder="Enter email">
        <br><br>

        <label>Password:</label>
        <input type="password" placeholder="Enter password">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender" value="male" id="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" value="female" id="female">
        <label for="female">Female</label>
        <input type="radio" name="gender" value="other" id="other">
        <label for="other">Other</label>
        <br><br>

        <label>Age:</label>
        <input type="number" placeholder="Enter age">
        <br><br>
        <label>Date of Birth:</label>
        <input type="date">
        <br><br>
        <label>Country:</label>
        <select>
            <option disabled selected>Select your country</option>
            <option value="nepal">Nepal</option>
            <option value="india">India</option>
            <option value="china">China</option>
        </select>
        <br><br>
        <label>Contact:</label>
        <input type="tel" placeholder="98xxxxxxxx">
        <br><br>
        <label>Choose your hobbies:</label>
        <input type="checkbox" id="Coding" name="hobbies">
        <label for="Coding">Coding</label>
        <input type="checkbox" name="hobbies"  id="reading">
        <label for="reading">Reading</label>
        <input type="checkbox" name="hobbies" id="traveling">
        <label for="traveling">Traveling</label>
        <input type="checkbox" name="hobbies"  id="sports">
        <label for="sports">Sports</label>

        <br><br>
        <label>Educational Qualifications:</label>
        <select>
            <option disabled selected>Select your qualification</option>
            <option value="highschool">High School</option>
            <option value="diploma">Diploma</option>
            <option value="bachelor">Bachelor's Degree</option>
            <option value="master">Master's Degree</option>
        </select>
        <br><br>
        <label>Upload your CV:</label>
        <input type="file">
        <br><br>

        <button type="submit">Submit</button>

    </form>
    
</body>
</html>
